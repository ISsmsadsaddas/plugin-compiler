name: Cloud Plugin Compiler
on:
  repository_dispatch:
    types: [compile-code]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Template Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Write AI Code into project structure
        run: |
          mkdir -p src/main/resources
          mkdir -p src/main/java/com/aromelis/plugin
          rm -f src/main/resources/plugin.yml
          rm -f src/main/java/com/aromelis/plugin/Main.java
          echo '${{ github.event.client_payload.pluginYml }}' > src/main/resources/plugin.yml
          echo '${{ github.event.client_payload.mainClassCode }}' > src/main/java/com/aromelis/plugin/Main.java

      - name: Compile Code to Jar Binary
        run: mvn clean package

      - name: Upload Jar to Free Storage and Get Link
        run: |
          JAR_FILE=$(ls target/*.jar)
          RESPONSE=$(curl -F "file=@$JAR_FILE" https://file.io)
          DOWNLOAD_URL=$(echo $RESPONSE | jq -r '.link')
          echo "--------------------------------------------------------"
          echo "DOWNLOAD URL: $DOWNLOAD_URL"
          echo "--------------------------------------------------------"
